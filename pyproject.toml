[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridrec"
version = "0.1.0"
description = "Graph + VAE customer vectors fed into an LLM reranker"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["hybridrec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning", "ignore::FutureWarning"]
